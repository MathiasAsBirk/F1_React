name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            f1-app/package-lock.json
            backend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: f1-app
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Lint frontend
        run: npm run lint
        working-directory: f1-app
      - name: Check backend
        run: npm run check
        working-directory: backend
      - name: Test frontend
        run: npm test
        working-directory: f1-app
      - name: Test backend
        run: npm test
        working-directory: backend
      - name: Build frontend
        run: npm run build
        working-directory: f1-app
